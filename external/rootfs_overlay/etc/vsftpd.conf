listen=YES                 # Run as standalone server
listen_ipv6=NO             # Disable IPv6 if not needed
anonymous_enable=NO        # Disable anonymous login
local_enable=YES           # Allow local users
write_enable=YES           # Allow upload / modification
local_umask=022            # Permissions for uploaded files
chroot_local_user=YES      # Restrict users to their home dirs (optional)
pasv_enable=YES            # Enable passive mode
pasv_min_port=30000
pasv_max_port=30010
local_root=/               #full access
